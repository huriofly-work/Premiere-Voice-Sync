name: Windows CI

# Docs-only changes (Markdown and docs/, except release metadata that the
# distribution check reads) skip the Windows suite. The filter is a job, not
# `on.paths`, so a skipped `regression-tests` still reports as passed and can be
# a required check. Require `changes` too: if it fails, the skipped test job
# alone would read as passed. Pull requests are the merge gate; a newer push to
# the same PR cancels the older run.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect code changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR merge commit; its first parent is the base branch.
          # A failed diff stops the job (bash -e), so it never reads as docs-only.
          files=$(git -c core.quotePath=false diff --name-only HEAD^1 HEAD)
          code=false
          while IFS= read -r file; do
            case "$file" in
              '') ;;
              docs/releases/*/*) ;;
              docs/releases/*.json) code=true ;;
              docs/*|*.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  regression-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify JavaScript syntax
        shell: powershell
        run: |
          node --check extension/js/main.js
          if ($LASTEXITCODE -ne 0) { throw 'UI syntax check failed' }
          node --check extension/js/security.js
          if ($LASTEXITCODE -ne 0) { throw 'Security syntax check failed' }
          node tests/unit/speed-merge-host.js
          if ($LASTEXITCODE -ne 0) { throw 'Speed merge host preflight mock failed' }

      - name: Run regression suite without external Windows integration
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Run-Tests.ps1 -NoWindowsIntegration

      - name: Verify distribution metadata
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\Verify-GitHubDistribution.ps1

      - name: Confirm runtime binaries are not tracked
        shell: powershell
        run: |
          $tracked = @(git ls-files extension/engine/runtime)
          if ($tracked.Count) { throw "Runtime binaries must not be committed: $($tracked -join ', ')" }
          $generated = @(git ls-files dist extension/native/PvsNotifications.exe extension/native/helper-lock.json)
          if ($generated.Count) { throw "Generated artifacts must not be committed: $($generated -join ', ')" }
